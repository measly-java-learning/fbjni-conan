name: macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["recipes/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["recipes/**", ".github/workflows/macos.yml"]

permissions:
  contents: read

jobs:
  create:
    name: ${{ matrix.arch }} shared=${{ matrix.shared }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: armv8, java_home_var: JAVA_HOME_25_arm64, shared: "True" }
          - { runner: macos-15, arch: armv8, java_home_var: JAVA_HOME_25_arm64, shared: "False" }
          - { runner: macos-15-intel, arch: x86_64, java_home_var: JAVA_HOME_25_X64, shared: "True" }
          - { runner: macos-15-intel, arch: x86_64, java_home_var: JAVA_HOME_25_X64, shared: "False" }
    runs-on: ${{ matrix.runner }}
    env:
      CONAN_VERSION: "2.33.0"
    steps:
      - uses: actions/checkout@v5

      - name: Install Conan
        run: |
          python3 -m venv "$RUNNER_TEMP/conan"
          "$RUNNER_TEMP/conan/bin/pip" install --quiet "conan==$CONAN_VERSION"
          echo "$RUNNER_TEMP/conan/bin" >> "$GITHUB_PATH"

      - name: Detect profile
        run: |
          conan profile detect
          conan profile show

      # The runner's preinstalled JDK supplies jni.h, so nothing is downloaded
      - name: Create package
        run: |
          export JAVA_HOME="${!JAVA_HOME_VAR}"
          echo "JAVA_HOME=$JAVA_HOME"
          conan create recipes/fbjni/all --version 0.8.1 \
            -s arch=${{ matrix.arch }} -s os.version=11.0 \
            -o "fbjni/*:shared=${{ matrix.shared }}" -o "fbjni/*:system_java=True" \
            --format=json > "$RUNNER_TEMP/create.json"
          jq -r '.graph.nodes[] | select(.ref | startswith("fbjni/")) | .package_folder' \
            "$RUNNER_TEMP/create.json" > "$RUNNER_TEMP/package_folder"
        env:
          JAVA_HOME_VAR: ${{ matrix.java_home_var }}

      - name: Inspect dylib
        if: matrix.shared == 'True'
        run: |
          lib="$(cat "$RUNNER_TEMP/package_folder")/lib/libfbjni.dylib"
          lipo -archs "$lib"
          otool -L "$lib"
          install_name="$(otool -D "$lib" | tail -1)"
          minos="$(otool -l "$lib" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')"
          echo "install name: $install_name"
          echo "minos: $minos"
          test "$install_name" = "@rpath/libfbjni.dylib"
          test "$minos" = "11.0"
