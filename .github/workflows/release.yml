name: Release

# Builds the shared libraries that fbjni-runtime-dist packages into org.measly:fbjni-natives.
# Pushing a tag v<fbjni version>-r<build revision> (v0.8.1-r1) publishes them as a GitHub Release;
# a manual run builds the same archives and keeps them as workflow artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: fbjni version to build
        default: "0.8.1"

permissions:
  contents: read

env:
  CONAN_VERSION: "2.33.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.parse.outputs.version }}
      name: ${{ steps.parse.outputs.name }}
    steps:
      - id: parse
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-r([0-9]+)$ ]]; then
              echo "::error::tag must look like v0.8.1-r1, got $GITHUB_REF_NAME"
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            name="fbjni-$version-r${BASH_REMATCH[2]}"
          else
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like 0.8.1, got $INPUT_VERSION"
              exit 1
            fi
            version="$INPUT_VERSION"
            name="fbjni-$version-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building $name"

  # manylinux_2_28 with gcc-toolset-14 and a Corretto 8 JDK, so the library loads on glibc 2.28 and
  # later and nothing is downloaded for jni.h
  linux:
    name: linux-${{ matrix.platform }}
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: x86_64, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, platform: aarch64, arch: armv8 }
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/measly-java-learning/engine-build@sha256:1924db18a45755a4d3ea2e0229baa8219468096e5f95f139fdc83f2ea9d8683a
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: ${{ needs.version.outputs.name }}-linux-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Conan
        run: |
          /opt/python/cp312-cp312/bin/python3 -m venv "$RUNNER_TEMP/conan"
          "$RUNNER_TEMP/conan/bin/pip" install --quiet "conan==$CONAN_VERSION"
          echo "$RUNNER_TEMP/conan/bin" >> "$GITHUB_PATH"

      - name: Detect profile
        run: |
          CC=gcc CXX=g++ conan profile detect
          conan profile show

      - name: Create package
        run: |
          conan create recipes/fbjni/all --version "$VERSION" \
            -s arch=${{ matrix.arch }} -s build_type=Release \
            -o "fbjni/*:shared=True" -o "fbjni/*:system_java=True" \
            --format=json > "$RUNNER_TEMP/create.json"
          python3 .github/scripts/package_folder.py "$RUNNER_TEMP/create.json" > "$RUNNER_TEMP/package_folder"

      - name: Assemble archive
        run: |
          pkg="$(cat "$RUNNER_TEMP/package_folder")"
          stage="$RUNNER_TEMP/stage/$ARCHIVE"
          mkdir -p "$stage/lib"
          cp -R "$pkg/include" "$pkg/licenses" "$stage/"
          cp "$pkg/lib/libfbjni.so" "$stage/lib/"
          lib="$stage/lib/libfbjni.so"
          strip --strip-unneeded "$lib"

          file "$lib"
          readelf -d "$lib" | grep -E "NEEDED|SONAME"
          glibc="$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          glibcxx="$(objdump -T "$lib" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)"
          echo "newest symbol versions: $glibc $glibcxx"
          test "$(readelf -d "$lib" | sed -n 's/.*Library soname: \[\(.*\)\]/\1/p')" = "libfbjni.so"
          # facebookincubator/fbjni#123: must depend on libdl itself before glibc 2.34
          readelf -d "$lib" | grep -q 'Shared library: \[libdl.so.2\]'
          # manylinux_2_28: glibc 2.28 and the GCC 8 libstdc++ that ships with it
          test "$(printf '%s\n' "$glibc" GLIBC_2.28 | sort -V | tail -1)" = GLIBC_2.28
          test "$(printf '%s\n' "$glibcxx" GLIBCXX_3.4.25 | sort -V | tail -1)" = GLIBCXX_3.4.25

          tar -C "$RUNNER_TEMP/stage" -czf "$RUNNER_TEMP/$ARCHIVE.tar.gz" "$ARCHIVE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  # One Conan build per arch on an arm64 runner (x86_64 cross-compiled), merged into one universal2
  # dylib with a minimum of macOS 11.0
  macos:
    name: macos-universal2
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCHIVE: ${{ needs.version.outputs.name }}-macos-universal2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Conan
        run: |
          python3 -m venv "$RUNNER_TEMP/conan"
          "$RUNNER_TEMP/conan/bin/pip" install --quiet "conan==$CONAN_VERSION"
          echo "$RUNNER_TEMP/conan/bin" >> "$GITHUB_PATH"

      - name: Detect profile
        run: |
          conan profile detect
          conan profile show

      # The runner's preinstalled JDK supplies jni.h. test_package runs the x86_64 build under
      # Rosetta when the runner has it, and is skipped otherwise.
      - name: Create packages
        run: |
          export JAVA_HOME="$JAVA_HOME_25_arm64"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            x86_can_run=True
          else
            x86_can_run=False
            echo "::warning::Rosetta is not available; the x86_64 test_package will not run"
          fi
          for arch in armv8 x86_64; do
            can_run=True
            [ "$arch" = x86_64 ] && can_run=$x86_can_run
            conan create recipes/fbjni/all --version "$VERSION" \
              -s arch=$arch -s build_type=Release -s os.version=11.0 \
              -o "fbjni/*:shared=True" -o "fbjni/*:system_java=True" \
              -c tools.build.cross_building:can_run=$can_run \
              --format=json > "$RUNNER_TEMP/create-$arch.json"
            python3 .github/scripts/package_folder.py "$RUNNER_TEMP/create-$arch.json" > "$RUNNER_TEMP/package_folder-$arch"
          done

      - name: Assemble archive
        run: |
          arm="$(cat "$RUNNER_TEMP/package_folder-armv8")"
          x86="$(cat "$RUNNER_TEMP/package_folder-x86_64")"
          stage="$RUNNER_TEMP/stage/$ARCHIVE"
          mkdir -p "$stage/lib"
          cp -R "$arm/include" "$arm/licenses" "$stage/"
          lib="$stage/lib/libfbjni.dylib"
          lipo -create "$arm/lib/libfbjni.dylib" "$x86/lib/libfbjni.dylib" -output "$lib"
          strip -x "$lib"
          # strip invalidates the linker's ad-hoc signature, which arm64 requires
          codesign --force --sign - "$lib"
          codesign --verify "$lib"

          otool -L "$lib"
          test "$(lipo -archs "$lib" | tr ' ' '\n' | sort | xargs)" = "arm64 x86_64"
          test "$(otool -D "$lib" | tail -1)" = "@rpath/libfbjni.dylib"
          for arch in arm64 x86_64; do
            minos="$(otool -arch $arch -l "$lib" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')"
            echo "$arch minos: $minos"
            test "$minos" = "11.0"
          done

          tar -C "$RUNNER_TEMP/stage" -czf "$RUNNER_TEMP/$ARCHIVE.tar.gz" "$ARCHIVE"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NAME: ${{ needs.version.outputs.name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ needs.version.outputs.name }}-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          test "$(ls *.tar.gz | wc -l)" -eq 3
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          fbjni $VERSION ([upstream](https://github.com/facebookincubator/fbjni/releases/tag/v$VERSION)), built from this repo's recipe at $GITHUB_SHA with Conan $CONAN_VERSION. Shared, Release, stripped.

          - \`$NAME-linux-x86_64.tar.gz\`, \`$NAME-linux-aarch64.tar.gz\`: GCC 14 on manylinux_2_28, needs glibc 2.28 or later
          - \`$NAME-macos-universal2.tar.gz\`: arm64 and x86_64, apple-clang, minimum macOS 11.0

          Each archive holds \`lib/\`, \`include/\` and \`licenses/\`. Verify with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$NAME" --notes-file notes.md
